<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    
</head>
<body>
    <header>
        <img src="./assets/img/logo.png" alt="logo_helpdesk">
        <nav>
            <p class="header_nav">Atlas Solutions / Support</p>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Gestion des demandes</h1>
            <p>Centralisez les incidents et simplifiez le suivi de votre équipe.</p>
            <form action="" onsubmit="event.preventDefault()">
                <fieldset>
                    <div class="legend">
                        <h2>Créer une demande</h2>
                        <p>Décrivez votre problème informatique en quelques étapes.</p>  
                    </div>

                    <div class="inputs">
                            <div class="group_label label_input">
                                <label for="titre">titre</label><br>
                                <input type="text" id="titre" name="titre" placeholder="Connexion Wi-Fi instable" required>
                            </div>
                            <div class="group_label label_select">
                                <label for="categorie">categorie</label><br>
                                <select name="categorie" id="categorie">
                                    <option value="">choisit une categorie</option>
                                    <option value="réseau">réseau</option>
                                    <option value="Matériel">Matériel</option>
                                    <option value="Logiciel">Logiciel</option>
                                </select>
                            </div>
                            <div class="group_label label_select">
                                <label for="priorité">priorité</label><br>
                                <select name="priorité" id="priorité">
                                    <option value="Normale">Normale</option>
                                    <option value="Basse">Basse</option>
                                    <option value="haute">haute</option>
                                </select>
                            </div>
                            <div class=" group_label label_textarea">
                                <label for="description">description</label><br>
                                <textarea name="description" id="description" placeholder="Décrivez le problème informatique rencontré..."></textarea>
                            </div>
                    </div>
                    <button class="ajouter_demande" onclick = "validateForm()">＋  Ajouter la demande</button>
                </fieldset>
            </form>
        </section>

        <section class="section_liste_demandes">

            <div class="header_listeDemandes">

                <div class="premiere_col__header_listeDemandes">
                    <h2>Liste des demandes</h2>
                    <p class="categorie_badge">3 demandes</p>
                </div>

                <div class="carte_tab">
                    <p class="focus_carte_tab carte">Cartes</p>
                    <p class="tab">Tableau</p>
                </div>

            </div>

            <div id="liste_demandes" class="liste_demandes" >   
            </div> 

        </section>
    </main>
    <script src="./js/script.js"></script>
</body>
</html>
